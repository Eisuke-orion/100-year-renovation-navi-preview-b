<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Instagram投稿 修正確認｜人生100年時代のリフォーム応援ナビ</title>
  <style>
    :root{--navy:#082b4c;--green:#536b3b;--coral:#f18472;--cream:#fbf7f1;--line:#ddd8cf;--white:#fffdf9}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.75}
    header{padding:56px 24px 40px;background:var(--white);border-bottom:1px solid var(--line)}.wrap{max-width:1180px;margin:auto}.eyebrow{font-size:13px;letter-spacing:.16em;color:var(--green);font-weight:700}h1{font-size:clamp(28px,4vw,48px);line-height:1.25;margin:8px 0 16px}.lead{max-width:820px;margin:0;color:#43505d}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}.stat{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff}.stat strong{display:block;font-size:26px;color:var(--green)}
    main{padding:32px 24px 80px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}.filter{border:1px solid var(--line);background:#fff;padding:9px 15px;border-radius:999px;color:var(--navy);cursor:pointer;font-weight:700}.filter[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
    .group-title{font-size:24px;margin:40px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--green)}.cards{display:grid;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(8,43,76,.05)}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.id{font-weight:800}.tag{font-size:12px;padding:4px 9px;border-radius:999px;background:#eef1e9;color:var(--green);font-weight:700}.status{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:999px;background:#e9f3ec;color:#245837;font-weight:800}.status.policy{background:#e9eff5;color:var(--navy)}.status.nochange{background:#f3f0e8;color:#695d41}
    dl{display:grid;grid-template-columns:130px 1fr;gap:8px 18px;margin:0}dt{font-size:13px;color:var(--green);font-weight:800}dd{margin:0}.instruction{font-weight:700}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.figure{margin:0}.figure img{display:block;width:100%;max-height:690px;object-fit:contain;background:#f3f0ea;border-radius:12px;border:1px solid var(--line)}.figure figcaption{text-align:center;font-size:12px;color:#6b737b;margin-top:6px;font-weight:700}.note{font-size:13px;color:#6b737b;margin-top:24px}
    @media(max-width:720px){header{padding-top:36px}.summary{grid-template-columns:1fr 1fr}.card{padding:16px}dl{grid-template-columns:1fr;gap:2px}.comparison{grid-template-columns:1fr}.status{margin-left:0}.group-title{font-size:20px}}
  </style>
</head>
<body>
  <header><div class="wrap"><div class="eyebrow">人生100年時代のリフォーム応援ナビ</div><h1>Instagram投稿 修正確認</h1><p class="lead">PDF注釈と理事長コメントを、原文・解釈・対応内容・確認状態に分けて一覧化しています。画像修正がある項目は、修正前後を1枚ずつ確認できます。</p><div class="summary" id="summary"></div></div></header>
  <main><div class="wrap"><div class="toolbar" id="toolbar"></div><div id="content"></div><p class="note">画像はInstagramフィード推奨の縦型4:5（1080×1350px）で制作。公開用リンクは各回の公開準備が整うまでコラムトップページを仮設定しています。</p></div></main>
  <script>
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let data,active='すべて';
    const groups=['すべて','全体方針',...Array.from({length:16},(_,i)=>`投稿${i+1}`)];
    function draw(){
      const records=data.records.filter(r=>active==='すべて'||r.theme===active);
      document.querySelector('#toolbar').innerHTML=groups.filter(g=>g==='すべて'||data.records.some(r=>r.theme===g)).map(g=>`<button class="filter" aria-pressed="${g===active}" data-group="${g}">${g}</button>`).join('');
      document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{active=b.dataset.group;draw()});
      const by={};records.forEach(r=>(by[r.theme]??=[]).push(r));
      document.querySelector('#content').innerHTML=Object.entries(by).map(([theme,items])=>`<section><h2 class="group-title">${esc(theme)} <small>（${items.length}件）</small></h2><div class="cards">${items.map(card).join('')}</div></section>`).join('');
    }
    function card(r){
      const cls=r.status==='方針回答'?'policy':r.status==='対応不要'?'nochange':'';
      const images=r.before&&r.after?`<div class="comparison"><figure class="figure"><img loading="lazy" src="${r.before}" alt="${esc(r.theme)} ${esc(r.target)} 修正前"><figcaption>修正前</figcaption></figure><figure class="figure"><img loading="lazy" src="${r.after}" alt="${esc(r.theme)} ${esc(r.target)} 修正後"><figcaption>修正後</figcaption></figure></div>`:'';
      return `<article class="card"><div class="meta"><span class="id">${esc(r.id)}</span><span class="tag">${esc(r.source)} p.${esc(r.page)}</span><span class="tag">${esc(r.target)}</span><span class="status ${cls}">${esc(r.status)}</span></div><dl><dt>指示原文</dt><dd class="instruction">${esc(r.instruction)}</dd><dt>解釈</dt><dd>${esc(r.interpretation)}</dd><dt>対応内容</dt><dd>${esc(r.response)}</dd></dl>${images}</article>`;
    }
    fetch('register.json?rev=20260911').then(r=>r.json()).then(j=>{data=j;document.querySelector('#summary').innerHTML=[['指示・確認事項',j.summary.total+'件'],['対応済み',j.summary.completed+'件'],['対応不要',j.summary.no_change+'件'],['方針回答',j.summary.policy_answer+'件']].map(x=>`<div class="stat"><strong>${x[1]}</strong>${x[0]}</div>`).join('');draw()}).catch(e=>{document.querySelector('#content').textContent='台帳の読み込みに失敗しました。'});
  </script>
</body>
</html>
