<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#be6747"/></marker></defs><rect width="1200" height="950" rx="20" fill="#f5f4ef"/><style>text{font-family:"Noto Sans JP",sans-serif;fill:#263f38} .head{font-size:29px;font-weight:700}.label{font-size:24px}.small{font-size:20px}.wall{fill:white;stroke:#39574d;stroke-width:6}.route{fill:none;stroke:#be6747;stroke-width:5;stroke-dasharray:9 6;marker-end:url(#arrow)}</style><text x="55" y="58" class="head">洗濯動線は「干す場所」と「収納」で変わる</text><rect x="35" y="130" width="550" height="755" rx="14" fill="#eee6da"/><rect x="615" y="130" width="550" height="755" rx="14" fill="#e1ebe5"/><text x="65" y="180" class="head">外へ運んで干す配置</text><text x="645" y="180" class="head">近くで干してしまう配置</text><rect x="70" y="230" width="290" height="210" class="wall"/><text x="90" y="265" class="label">1階・洗面脱衣室</text><rect x="95" y="300" width="90" height="90" rx="5" fill="#dbe6e4"/><circle cx="140" cy="345" r="29" fill="white" stroke="#39574d" stroke-width="3"/><text x="205" y="345" class="label">洗う</text><rect x="400" y="235" width="140" height="200" class="wall"/><path d="M400 260h140m-140 25h140m-140 25h140m-140 25h140m-140 25h140m-140 25h140" stroke="#97a89c" stroke-width="2"/><text x="425" y="470" class="label">階段</text><rect x="70" y="535" width="250" height="205" class="wall"/><text x="90" y="575" class="label">2階・居室収納</text><rect x="95" y="610" width="130" height="90" fill="#e4dbc7"/><text x="110" y="660" class="label">しまう</text><rect x="365" y="535" width="175" height="205" class="wall"/><text x="380" y="575" class="label">ベランダ</text><path d="M385 605h130m-110 0v65m25-65v65m25-65v65m25-65v65" stroke="#39574d" stroke-width="3"/><text x="398" y="710" class="label">干す</text><path d="M250 390L380 420L470 440L470 515" class="route"/><path d="M380 720L340 755L260 710" class="route"/><text x="65" y="805" class="label">上下移動・天候・収納までの往復</text><text x="65" y="845" class="small">洗濯かごを持つ経路を確認する</text><rect x="650" y="230" width="475" height="510" class="wall"/><path d="M650 435h190m80 0h205M895 435v305" stroke="#39574d" stroke-width="6"/><text x="670" y="270" class="label">洗面・ランドリースペース</text><rect x="675" y="300" width="85" height="85" rx="5" fill="#dbe6e4"/><circle cx="717" cy="342" r="28" fill="white" stroke="#39574d" stroke-width="3"/><text x="780" y="355" class="label">洗う</text><path d="M925 310h165m-145 0v65m30-65v65m30-65v65m30-65v65" stroke="#39574d" stroke-width="3"/><text x="955" y="415" class="label">干す</text><rect x="675" y="485" width="190" height="70" fill="#e4dbc7"/><text x="697" y="530" class="label">畳む作業台</text><text x="680" y="630" class="small">家族が通れる</text><text x="680" y="665" class="small">空間を残す</text><text x="930" y="485" class="label">収納</text><rect x="945" y="525" width="150" height="140" fill="#e4dbc7"/><text x="975" y="603" class="label">しまう</text><path d="M830 325L905 325" class="route"/><path d="M880 385L880 470L800 475" class="route"/><path d="M805 570L865 700L1010 700L1010 675" class="route"/><text x="645" y="805" class="label">同じ階で、家事の工程を近づける</text><text x="645" y="845" class="small">換気・除湿と通路の確保もセット</text><text x="55" y="925" class="small">※標準間取りや実在住宅の施工図ではありません。</text></svg>