<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="返済予定表で見る4か所。返済月、支払総額、元金と利息、金利の適用時期。"><rect width="720" height="440" rx="18" fill="#faf9f3"/><style>text{font-family:"Noto Sans JP",sans-serif;fill:#304b39}.sm{font-size:18px}.md{font-size:22px;font-weight:bold}.lg{font-size:28px;font-weight:bold}.line{fill:none;stroke:#5e7865;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><text x="30" y="44" class="md">通知を開いたら、ここに印を</text><rect x="85" y="70" width="550" height="330" rx="8" fill="white" stroke="#a0af9a" stroke-width="2"/><text x="115" y="112" class="md">返済予定表 〔説明用の見本〕</text><path d="M115 132H605" class="line"/><text x="115" y="171" class="sm">① 返済月</text><text x="365" y="171" class="md">○年 ○月</text><rect x="105" y="187" width="510" height="55" rx="8" fill="#f6e4bb"/><text x="115" y="223" class="sm">② 毎月の支払額</text><text x="365" y="223" class="md">80,000円</text><text x="115" y="280" class="sm">③ 内訳</text><text x="300" y="280" class="sm">元金60,000／利息20,000</text><text x="115" y="334" class="sm">④ 金利・適用日</text><text x="365" y="334" class="md">通知と照合</text><text x="115" y="374" class="sm">金利が変わる日 ≠ 返済額が変わる日</text></svg>