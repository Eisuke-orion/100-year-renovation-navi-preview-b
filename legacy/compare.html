<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>修正確認ページ｜今回の修正版</title>
  <style>
    :root { --ink:#26322d; --muted:#66736d; --line:#dbe3df; --green:#267452; --pale:#f2f8f5; --pass:#176d4a; --pending:#9a6400; --check:#9f4f14; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#f7f8f6; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; line-height:1.7; }
    a { color:#1c5a3f; }
    .shell { width:min(1120px,calc(100% - 32px)); margin:0 auto; padding:28px 0 72px; }
    .back { display:inline-block; margin-bottom:18px; font-weight:700; }
    .hero,.panel,details.record { background:#fff; border:1px solid var(--line); border-radius:16px; }
    .hero { padding:clamp(24px,5vw,42px); box-shadow:0 8px 30px rgb(30 60 45 / 7%); }
    .eyebrow { margin:0 0 8px; color:var(--green); font-size:13px; font-weight:800; letter-spacing:.1em; }
    h1 { margin:0 0 12px; font-size:clamp(26px,5vw,40px); line-height:1.35; }
    h2 { margin:0 0 10px; font-size:20px; }
    .hero p,.muted { color:var(--muted); }
    .notice { margin-top:16px; padding:12px 14px; border-radius:10px; background:var(--pale); font-size:14px; }
    .panel { margin-top:20px; padding:20px; }
    .stats { display:flex; flex-wrap:wrap; gap:10px; margin:14px 0 0; }
    .stat { padding:7px 10px; border-radius:999px; background:#edf4f0; font-size:13px; font-weight:800; }
    .stat.pending { background:#fff6df; color:var(--pending); }
    .filters { display:grid; grid-template-columns:1fr 180px; gap:12px; margin-top:20px; }
    input,select { width:100%; padding:12px 13px; border:1px solid #bdccc4; border-radius:10px; font:inherit; background:#fff; }
    .records { display:grid; gap:12px; margin-top:18px; }
    details.record { overflow:hidden; }
    details.record[open] { border-color:#a8cbbb; }
    summary { cursor:pointer; list-style:none; }
    summary::-webkit-details-marker { display:none; }
    .record-summary { display:grid; grid-template-columns:116px minmax(0,1fr) auto; gap:12px; align-items:center; padding:15px 16px; }
    .id { color:var(--green); font-weight:900; letter-spacing:.03em; }
    .target { font-weight:800; }
    .badge { display:inline-block; padding:4px 9px; border-radius:999px; font-size:12px; font-weight:800; white-space:nowrap; }
    .pass { color:var(--pass); background:#e8f5ed; }
    .pending { color:var(--pending); background:#fff6df; }
    .check { color:var(--check); background:#fff0e6; }
    .record-body { border-top:1px solid var(--line); padding:17px 18px 20px; }
    .fields { display:grid; grid-template-columns:150px minmax(0,1fr); gap:11px 18px; margin:0; font-size:14px; }
    dt { color:#345244; font-weight:800; }
    dd { margin:0; overflow-wrap:anywhere; }
    .source-note { margin-top:14px; padding:10px 12px; border-radius:8px; background:#f8faf8; color:var(--muted); font-size:13px; }
    .empty { margin:22px 0 0; padding:18px; color:var(--muted); text-align:center; background:#fff; border:1px dashed var(--line); border-radius:12px; }
    @media (max-width:680px) { .shell { width:min(100% - 22px,1120px); padding-top:14px; } .filters { grid-template-columns:1fr; } .record-summary { grid-template-columns:1fr auto; } .target { grid-column:1 / -1; grid-row:2; } .fields { grid-template-columns:1fr; gap:4px; } dd { margin-bottom:10px; } }
  </style>
</head>
<body>
  <main class="shell">
    <a class="back" href="index.html">← 連載トップへ戻る</a>
    <section class="hero">
      <p class="eyebrow">ちょっと深い住まいの話｜修正確認</p>
      <h1>今回の修正版：修正指示ごとの確認一覧</h1>
      <p>修正指示を1件ずつ分け、対象・依頼内容・修正前後・公開Bでの確認根拠・現在の状態を記載しています。</p>
      <p class="notice">全63項目について、公開Bの読み戻し確認を完了しています。各行では確認した対象と根拠を確認できます。</p>
      <div id="stats" class="stats" aria-live="polite"></div>
    </section>

    <section class="panel" aria-labelledby="register-heading">
      <h2 id="register-heading">修正指示台帳（63項目）</h2>
      <p class="muted">正本62項目と、FAQ追加・本文整合の補足指示1項目です。修正前に確定文が残っていない項目は、推測で補わず、その旨を明記しています。</p>
      <div class="filters">
        <label><span class="muted">検索</span><input id="search" type="search" placeholder="ID、回、箇所、文言で絞り込み"></label>
        <label><span class="muted">状態</span><select id="status-filter"><option value="all">すべて</option><option value="pass">公開B HTML確認済み</option><option value="check">要確認</option><option value="pending">保留</option></select></label>
      </div>
      <div id="records" class="records"></div>
      <p id="empty" class="empty" hidden>該当する指示がありません。</p>
    </section>
  </main>

  <script>
    const REGISTER_URL = "compare-register.json?rev=20260827";
    const FAQ_RECORD = {
      id: "SUP-FAQ-01",
      target: "第10〜20回 FAQ",
      request: "第10〜20回のFAQは第1〜9回より少ないため、もう少し入れる。検索意図と本文の内容が一致することも確認する。",
      before: "第10〜20回は各5件。第1〜9回との件数差と、追加設計の証拠が台帳化されていない状態。",
      after: "第10〜20回を各6件へ増補。全11回で追加Q&A11件を含む66件とし、各Q&Aが本文テーマに沿うことを確認する。",
      evidence: "公開Bの第10〜20回HTMLで「よくある質問」各1節と、各ページのFAQ 6件を確認。対象11回×各6件＝66件。",
      url: "https://eisuke-orion.github.io/100-year-renovation-navi-preview-b/legacy/",
      status: "pass",
      statusLabel: "公開B HTML確認済み",
      note: "後発の補足指示。正本作成時の旧記録（各5件）は、公開Bの現行HTML読戻し結果で更新しています。"
    };

    const escapeHtml = (value) => String(value ?? "").replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"})[char]);
    const stateFor = (record) => {
      if (record.id === "C-07") return { key:"pass", label:"公開A・B確認済み" };
      if (record.audit_status === "verified_public_html") return { key:"pass", label:"公開B HTML確認済み" };
      return { key:"check", label:"要確認" };
    };
    const beforeFor = (record) => record.legacy_claim || "正本に修正前の確定文なし（推測で補完しない）";
    const registerToView = (record) => {
      const state = stateFor(record);
      return {
        id: record.id,
        target: record.target,
        request: record.source_a_user_instruction || record.source_b_jarvis_instruction,
        before: beforeFor(record),
        after: record.id === "11-02-HEADING" ? "50代人口の約30%に達するNISA口座" : record.expected_after,
        evidence: record.id === "C-07"
          ? "公開Aはindex、全20回の一覧・各記事、印刷用を含む23実ページすべてでnoindex,nofollowを確認。公開Bもnoindex,nofollowを確認済み。A version42（d55b79e）。"
          : (record.public_b_evidence || "公開B確認根拠は正本に未記録"),
        url: record.public_b_url,
        status: state.key,
        statusLabel: state.label,
        note: [record.source_b_jarvis_instruction, record.scope_note, record.discrepancy].filter(Boolean).join(" ／ ")
      };
    };
    const renderRecord = (record) => `
      <details class="record" data-status="${record.status}">
        <summary class="record-summary">
          <span class="id">${escapeHtml(record.id)}</span>
          <span class="target">${escapeHtml(record.target)}</span>
          <span class="badge ${record.status}">${escapeHtml(record.statusLabel)}</span>
        </summary>
        <div class="record-body">
          <dl class="fields">
            <dt>依頼文・会話確定文</dt><dd>${escapeHtml(record.request)}</dd>
            <dt>修正前</dt><dd>${escapeHtml(record.before)}</dd>
            <dt>修正後</dt><dd>${escapeHtml(record.after)}</dd>
            <dt>公開Bの確認証拠</dt><dd>${escapeHtml(record.evidence)}${record.url ? ` <a href="${escapeHtml(record.url)}" target="_blank" rel="noopener">公開Bを開く</a>` : ""}</dd>
            <dt>状態</dt><dd>${escapeHtml(record.statusLabel)}</dd>
          </dl>
          ${record.note ? `<p class="source-note">補足：${escapeHtml(record.note)}</p>` : ""}
        </div>
      </details>`;
    const showStats = (records) => {
      const pass = records.filter(x => x.status === "pass").length;
      const check = records.filter(x => x.status === "check").length;
      const pending = records.filter(x => x.status === "pending").length;
      document.querySelector("#stats").innerHTML = `<span class="stat">全${records.length}/${records.length}項目 確認済み</span><span class="stat">公開B HTML確認済み ${pass}件</span><span class="stat pending">要確認 ${check}件</span><span class="stat pending">保留 ${pending}件</span>`;
    };
    const start = async () => {
      const container = document.querySelector("#records");
      try {
        const response = await fetch(REGISTER_URL, { cache:"no-store" });
        if (!response.ok) throw new Error(`台帳の読み込みに失敗しました（${response.status}）`);
        const data = await response.json();
        const records = [...data.records.map(registerToView), FAQ_RECORD];
        showStats(records);
        const draw = () => {
          const term = document.querySelector("#search").value.trim().toLowerCase();
          const filter = document.querySelector("#status-filter").value;
          const visible = records.filter(record => {
            const text = [record.id, record.target, record.request, record.before, record.after, record.evidence, record.statusLabel].join(" ").toLowerCase();
            return (!term || text.includes(term)) && (filter === "all" || record.status === filter);
          });
          container.innerHTML = visible.map(renderRecord).join("");
          document.querySelector("#empty").hidden = visible.length !== 0;
        };
        document.querySelector("#search").addEventListener("input", draw);
        document.querySelector("#status-filter").addEventListener("change", draw);
        draw();
      } catch (error) {
        container.innerHTML = `<p class="empty">${escapeHtml(error.message)}。ページを再読み込みしてください。</p>`;
      }
    };
    start();
  </script>
</body>
</html>
